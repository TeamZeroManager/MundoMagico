<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Mundo Mágico de Aprendizaje</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sky1:#ffc8e8;--sky2:#fff0fa;--ink:#6b2a7a;--card:#ffffff;--grass:#c3f0d2;--shadow:rgba(170,60,150,.28);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#4a1d5e;--sky2:#7a3590;--ink:#fff0fa;--card:#8f4fa6;--grass:#3a7a5a;--shadow:rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--sky1:#4a1d5e;--sky2:#7a3590;--ink:#fff0fa;--card:#8f4fa6;--grass:#3a7a5a;--shadow:rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0}
body{font-family:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:600;color:var(--ink);background:linear-gradient(var(--sky1),var(--sky2));overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0}
#app{position:relative;height:100%;width:100%}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:104px 12px 16px;overflow:hidden}
.screen[hidden]{display:none}
.ib{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);width:88px;height:88px;border-radius:24px;background:var(--card);font-size:44px;box-shadow:0 6px 0 var(--shadow);z-index:20}
.ib:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
#mute{right:12px}#home{left:12px}
#skip{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);min-height:88px;padding:0 32px;border-radius:44px;background:#ff6fb5;color:#fff;font-size:28px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.25);z-index:20}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.conf{position:absolute;top:-60px;font-size:34px;animation:fall 2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
h1{font-size:clamp(30px,7vw,54px);margin:0 0 6px;text-align:center;line-height:1.05;font-weight:800;color:#d63a97;text-shadow:0 4px 0 #fff}
.cloud{position:absolute;font-size:90px;opacity:.9;animation:drift 40s linear infinite;pointer-events:none}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
#menu{justify-content:center;gap:16px}
.big{width:min(520px,92vw);min-height:120px;border-radius:32px;background:var(--card);font-size:clamp(26px,6vw,40px);font-weight:800;display:flex;align-items:center;gap:18px;padding:0 28px;box-shadow:0 8px 0 var(--shadow);z-index:2;text-align:left}
.big:active{transform:translateY(5px);box-shadow:0 3px 0 var(--shadow)}
.big span{font-size:64px}
.big.c1{border-left:16px solid #ff6fb5}.big.c2{border-left:16px solid #c084fc}.big.c3{border-left:16px solid #5eead4}
.field{flex:1;width:100%;max-width:760px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:16px}
.item{position:relative;z-index:2;min-width:clamp(88px,24vw,120px);min-height:clamp(88px,24vw,120px);border-radius:50%;background:#fff;font-size:clamp(48px,13vw,66px);box-shadow:0 8px 0 rgba(0,0,0,.08),0 18px 16px -8px rgba(60,40,80,.3);animation:float 3s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes float{50%{transform:translateY(-14px) rotate(4deg)}}
.shake{animation:shake .5s!important}
@keyframes shake{20%,60%{transform:translateX(-14px) rotate(-8deg)}40%,80%{transform:translateX(14px) rotate(8deg)}}
.monster{position:relative;z-index:2;font-size:clamp(84px,16vw,130px);line-height:1;cursor:pointer;animation:float 2.6s ease-in-out infinite}
.monster.chew{animation:chew .3s 4}
@keyframes chew{50%{transform:scale(1.2,.85)}}
.say{display:flex;align-items:center;gap:14px;min-height:88px;padding:6px 26px;border-radius:44px;background:var(--card);font-size:clamp(24px,5.5vw,36px);font-weight:800;box-shadow:0 6px 0 var(--shadow);margin-bottom:8px;text-align:center}
.sw{width:56px;height:56px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px var(--shadow)}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.ex{font-size:min(34vw,220px);line-height:1}
.ex3{font-size:min(24vw,130px);line-height:1}
/* jardín dinámico */
@property --sky1{syntax:'<color>';inherits:true;initial-value:#dcc6ff}
@property --sky2{syntax:'<color>';inherits:true;initial-value:#f4ebff}
@property --gr1{syntax:'<color>';inherits:true;initial-value:#a9dca8}
@property --gr2{syntax:'<color>';inherits:true;initial-value:#7fc596}
@property --petal{syntax:'<color>';inherits:true;initial-value:#a855f7}
@property --glow{syntax:'<color>';inherits:true;initial-value:#f3e6ff}
#colors{justify-content:flex-start;gap:8px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));transition:--sky1 .9s,--sky2 .9s,--gr1 .9s,--gr2 .9s,--petal .9s,--glow .9s;background:radial-gradient(circle at 86% 11%,var(--glow) 0 7%,transparent 24%),radial-gradient(ellipse 90% 44% at 12% 100%,var(--gr1) 0 70%,transparent 71%),radial-gradient(ellipse 80% 40% at 95% 100%,var(--gr2) 0 70%,transparent 71%),linear-gradient(var(--sky1) 0,var(--sky2) 64%,var(--gr2) 64%,var(--gr2) 100%)}
#gdn{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.fl{position:absolute;width:1.5em;height:4em;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite;animation-delay:var(--d,0s)}
.fl::before{content:"";position:absolute;left:50%;top:.5em;width:.5em;height:.5em;margin-left:-.25em;border-radius:50%;background:#ffd84d;box-shadow:0 -.5em 0 var(--petal),.5em 0 0 var(--petal),0 .5em 0 var(--petal),-.5em 0 0 var(--petal),.35em .35em 0 var(--petal),-.35em .35em 0 var(--petal),.35em -.35em 0 var(--petal),-.35em -.35em 0 var(--petal)}
.fl::after{content:"";position:absolute;z-index:-1;left:50%;top:1em;bottom:0;width:.14em;margin-left:-.07em;border-radius:.1em;background:#3fa65a}
@keyframes sway{50%{transform:rotate(5deg)}}
.sign{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:16px;padding:8px 30px;background:#fff;color:#5b2a6b;border:6px solid #c58b4e;border-radius:28px;box-shadow:0 8px 0 #8f5f2c,0 16px 24px rgba(0,0,0,.15);font-size:clamp(34px,10vw,56px);font-weight:800;letter-spacing:.04em;min-height:88px}
.sign .rep{font-size:1.25em;line-height:1}
.sign .dot{width:.7em;height:.7em;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px rgba(0,0,0,.12)}
#colors .field{position:relative;z-index:2;gap:14px}
.pill{position:relative;z-index:2;min-height:88px;padding:0 42px;border-radius:44px;background:#fff;color:#5b2a6b;border:6px solid var(--petal);box-shadow:0 7px 0 var(--petal);font-size:clamp(26px,6vw,34px);font-weight:800}
.pill:active{transform:translateY(5px);box-shadow:0 2px 0 var(--petal)}
/* bosque */
#letters{--B:min(58vw,240px);justify-content:flex-start;gap:10px;overflow-y:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse 90% 26% at 15% 100%,#a5e8a0 0 70%,transparent 71%),linear-gradient(#cdeaff 0,#efe4ff 62%,#8fdc8a 62%,#5cc46f 100%)}
#vfo{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.tr{position:absolute;bottom:36%;left:var(--x);width:var(--s);height:calc(var(--s)*1.6)}
.tr::before{content:"";position:absolute;left:0;right:0;top:0;height:72%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9cf0a0,#3fae6a)}
.tr::after{content:"";position:absolute;z-index:-1;left:42%;width:16%;top:60%;bottom:0;border-radius:6px;background:#a8743a}
.tw{position:absolute;font-size:22px;animation:tw 2.4s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
#vSign{font-size:clamp(28px,8vw,46px)}
#vSign .vl{font-size:1.6em;line-height:1;color:#a855f7;text-shadow:0 4px 0 #ead9ff}
.bwrap{position:relative;z-index:2;flex:none;width:var(--B);height:calc(var(--B)*1.2)}
.board{position:absolute;inset:0}
.sl{position:absolute;border:4px dashed var(--c);border-radius:12px;background:rgba(255,255,255,.55);background:color-mix(in srgb,var(--c) 20%,transparent);animation:sp 2s ease-in-out infinite}
@keyframes sp{50%{opacity:.55}}
.sl.on{border-style:solid;background:var(--c);animation:pop .4s;box-shadow:inset 0 -6px 0 rgba(0,0,0,.14)}
.board.glow .sl.on{animation:gl .8s ease-in-out infinite alternate}
@keyframes gl{to{filter:brightness(1.25) drop-shadow(0 0 12px #ffd84d);transform:scale(1.03)}}
.van{position:absolute;inset:-6%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--B)*.62);line-height:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.92) 55%,transparent 70%);opacity:0;pointer-events:none}
.van.hop{opacity:1;animation:hop 2.6s ease-in-out}
.van.zig{opacity:1;animation:zig 2.6s ease-in-out}
@keyframes hop{0%{transform:scale(0)}15%{transform:scale(1.15)}30%,60%{transform:translateY(-10%) scale(1.05) rotate(-6deg)}45%,75%{transform:translateY(0) rotate(6deg)}100%{transform:scale(1)}}
@keyframes zig{0%{transform:translate(-90%,40%) scale(.3)}25%{transform:translate(40%,-30%) scale(1)}50%{transform:translate(-40%,20%)}75%{transform:translate(30%,-20%)}100%{transform:translate(0,0)}}
#vTray{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:420px}
.pcb{min-width:88px;min-height:88px;display:grid;place-items:center;border-radius:24px;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.12);animation:float 3s ease-in-out infinite}
.pcb:disabled{opacity:.25;box-shadow:none;animation:none}
.mini{display:block;border-radius:8px;background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15);width:calc(var(--B)*var(--w)/100*.5);height:calc(var(--B)*1.2*var(--h)/100*.5)}
#colors{overflow-y:auto}
.item svg{display:block;width:clamp(58px,17vw,84px);height:clamp(58px,17vw,84px);margin:auto}
.monster.jump{animation:jump .6s ease-in-out 4}
@keyframes jump{50%{transform:translateY(-70px) scale(1.1)}}
/* numbers */
#numbers{justify-content:flex-start;gap:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse 80% 22% at 10% 100%,#7be88a 0 70%,transparent 71%),radial-gradient(ellipse 70% 18% at 100% 100%,#7be88a 0 70%,transparent 71%),linear-gradient(#8fd3ff 0,#dff4ff 60%,#53cf68 60%,#34b152 100%)}
#fm{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sun{position:absolute;top:calc(env(safe-area-inset-top,0px) + 108px);right:10px;font-size:68px;animation:beat 4s ease-in-out infinite}
.fence{position:absolute;left:0;right:0;top:60%;height:64px;transform:translateY(-88%);border-radius:6px 6px 0 0;background:linear-gradient(#b9773a,#b9773a) 0 32%/100% 8px no-repeat,linear-gradient(#b9773a,#b9773a) 0 72%/100% 8px no-repeat,repeating-linear-gradient(90deg,#e2ab6b 0 22px,transparent 22px 40px)}
.barn{position:absolute;top:60%;transform:translateY(-100%);font-size:64px}
.grs{position:absolute;bottom:2%;font-size:36px}
#nBig{font-size:clamp(72px,20vw,120px);line-height:1;min-width:min(56vw,240px);padding:4px 30px;text-shadow:0 5px 0 rgba(0,0,0,.08)}
#corral{position:relative;z-index:2;width:min(100%,560px);margin:auto 0;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:12px;background:rgba(255,255,255,.45);border:6px solid #c58b4e;border-radius:28px;box-shadow:0 8px 0 #8f5f2c,0 16px 24px rgba(0,0,0,.12)}
.slot{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.5);font-size:clamp(34px,9vw,56px);line-height:1}
.slot.on{background:transparent}
.slot.bye{animation:bye .8s forwards}
.an{animation:pop .45s}
.an.bye{animation:bye .8s forwards}
@keyframes bye{to{transform:translateY(-120vh) rotate(720deg)}}
#carrot{--petal:#ff8a1f;animation:beat 1.8s ease-in-out infinite}
#carrot:active{animation:none}
@keyframes beat{50%{transform:scale(1.1)}}
/* letters */
#nm{width:min(340px,80vw);min-height:60px;border-radius:30px;border:4px solid var(--shadow);background:var(--card);color:var(--ink);font:inherit;font-size:26px;text-align:center;margin-bottom:8px}
.blk{width:104px;height:104px;border-radius:24px;background:linear-gradient(#ff9ad5,#c77dff);color:#fff;font-size:68px;font-weight:800;text-shadow:0 3px 0 rgba(0,0,0,.35);box-shadow:0 7px 0 #8e4fbf;animation:float 3.2s ease-in-out infinite;animation-delay:var(--d,0s)}
.blk.fly{animation:fly 1.5s ease-in-out;background:var(--card);font-size:72px;box-shadow:0 0 30px #ffd166}
@keyframes fly{0%{transform:scale(1)}25%{transform:translateY(-70px) scale(1.4) rotate(-12deg)}60%{transform:translateY(-110px) scale(1.5) rotate(12deg)}100%{transform:scale(1)}}
.blk.name{outline:5px solid #ffd166}
@media (prefers-reduced-motion:reduce){.cloud,.item,.blk,.monster{animation:none}}
button:focus-visible,input:focus-visible{outline:5px solid #ffb703;outline-offset:3px}
</style>
</head>
<body>
<main id="app">
<button id="mute" class="ib" aria-label="Silencio">🔊</button>
<button id="home" class="ib" aria-label="Inicio" hidden>🏠</button>
<button id="skip" hidden>¡A jugar! ⏭️</button>
<div id="fx"></div>

<section id="menu" class="screen">
  <span class="cloud" style="top:12%;animation-delay:-5s">☁️</span>
  <span class="cloud" style="top:48%;animation-delay:-22s;font-size:70px">🦋</span>
  <span class="cloud" style="top:78%;animation-delay:-35s">🌈</span>
  <h1>🦄 El Mundo Mágico<br>de Aprendizaje ✨</h1>
  <button class="big c1" data-go="colors"><span>🌈</span>El Jardín de los Colores</button>
  <button class="big c2" data-go="numbers"><span>🐰</span>La Granja de los Números</button>
  <button class="big c3" data-go="letters"><span>🧚</span>El Bosque de las Vocales</button>
</section>

<section id="colors" class="screen" hidden>
  <div id="gdn" aria-hidden="true"></div>
  <div class="sign" id="cBan"></div>
  <div class="field" id="cField"></div>
  <div class="monster" id="mon">🦄</div>
  <button class="pill" id="cBtn"></button>
</section>

<section id="numbers" class="screen" hidden>
  <div id="fm" aria-hidden="true">
    <span class="sun">🌞</span>
    <span class="cloud" style="top:14%;animation-delay:-6s">☁️</span>
    <span class="cloud" style="top:30%;animation-delay:-26s;font-size:64px">☁️</span>
    <span class="barn" style="left:4%">🏡</span>
    <i class="fence"></i>
    <span class="grs" style="left:6%">🌻</span><span class="grs" style="left:46%">🌷</span><span class="grs" style="right:7%">🌼</span>
  </div>
  <div class="sign" id="nBig"></div>
  <div id="corral"></div>
  <button class="pill" id="carrot"></button>
</section>

<section id="letters" class="screen" hidden>
  <div id="vfo" aria-hidden="true">
    <i class="tr" style="--x:2%;--s:100px"></i><i class="tr" style="--x:24%;--s:130px"></i><i class="tr" style="--x:52%;--s:95px"></i><i class="tr" style="--x:70%;--s:125px"></i><i class="tr" style="--x:90%;--s:90px"></i>
    <span class="tw" style="left:12%;top:22%">✨</span><span class="tw" style="left:80%;top:30%;--d:-.8s">✨</span><span class="tw" style="left:40%;top:14%;--d:-1.5s">✨</span><span class="tw" style="left:60%;top:50%;--d:-.4s">✨</span><span class="tw" style="left:8%;top:72%;--d:-1.9s">✨</span><span class="tw" style="left:90%;top:80%;--d:-1.1s">✨</span>
  </div>
  <div class="sign" id="vSign"></div>
  <div class="bwrap"><div class="board" id="vBoard"></div><div class="van" id="vAn"></div></div>
  <div id="vTray"></div>
</section>
</main>

<script>
const $=s=>document.querySelector(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let muted=false,run=0,skipFn=null,ac,voice;

/* ---------- Audio ---------- */
function tone(f,d=.15,t='sine',v=.15,at=0){
  if(muted)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+at;
    o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,s);
    g.gain.exponentialRampToValueAtTime(.001,s+d);
    o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d);}catch(e){}
}
const win=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.15,i*.09));
const boop=()=>{tone(320,.12,'sine',.2);tone(210,.2,'sine',.2,.1)};
const polka=()=>[392,494,392,494,440,523,440,523].forEach((f,i)=>tone(f,.18,'sawtooth',.06,i*.2));
function say(t){
  return new Promise(res=>{
    const ss=window.speechSynthesis;
    if(muted||!ss){setTimeout(res,1100);return}
    ss.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang='es-ES';u.rate=.85;u.pitch=1.3;
    voice=voice||ss.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('es'));
    if(voice)u.voice=voice;
    u.onend=u.onerror=()=>res();
    setTimeout(res,7000);
    ss.speak(u);
  });
}
function burst(n=28,set=['💖','🌸','✨','🦄','🎀','⭐','🌈','🦋']){
  const fx=$('#fx');
  for(let i=0;i<n;i++){
    const s=document.createElement('span');
    s.className='conf';s.textContent=rnd(set);
    s.style.left=Math.random()*100+'%';
    s.style.animationDelay=Math.random()*.6+'s';
    fx.appendChild(s);setTimeout(()=>s.remove(),3000);
  }
  win();
}
function tutorial(my,steps,play){
  const sk=$('#skip');sk.hidden=false;
  skipFn=()=>{run++;speechSynthesis.cancel();sk.hidden=true;play(run)};
  (async()=>{
    for(const s of steps){if(run!==my)return;await s();}
    if(run===my){sk.hidden=true;play(my)}
  })();
}

/* ---------- Navegación ---------- */
function go(id){
  run++;if(window.speechSynthesis)speechSynthesis.cancel();
  $('#fx').innerHTML='';$('#skip').hidden=true;skipFn=null;
  document.querySelectorAll('.screen').forEach(s=>s.hidden=s.id!==id);
  $('#home').hidden=id==='menu';
  if(id==='colors')colors(run);
  if(id==='numbers')numbers(run);
  if(id==='letters')letters(run);
  if(id==='menu')say('¡Hola! ¿A qué quieres jugar?');
}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
$('#home').onclick=()=>go('menu');
$('#skip').onclick=()=>skipFn&&skipFn();
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊';if(muted&&window.speechSynthesis)speechSynthesis.cancel()};

/* ---------- Módulo 1: Colores ---------- */
// Dinámica 1 · Luna la unicornio come SOLO fruta: la niña elige la fruta del color que Luna pide
const COL=[
 {n:'rojo',c:'#e53935',x:'una manzana',e:['🍎','🍓','🍒']},
 {n:'amarillo',c:'#ffd400',x:'un plátano',e:['🍌','🍋','🍍']},
 {n:'naranja',c:'#ff8a1f',x:'una naranja',e:['🍊']},
 {n:'verde',c:'#2ecc71',x:'un kiwi',e:['🥝','🍏','🥑']},
 {n:'morado',c:'#8e44ad',x:'unas uvas',e:['🍇']}
];
// Dinámica 2 · Búsqueda con Isabella: primarios, secundarios y terciarios (g = familia parecida, no se mezclan)
const ISA=[
 {n:'rojo',c:'#e53935',g:'r'},{n:'azul',c:'#1e66f5',g:'b'},{n:'amarillo',c:'#ffd400',g:'y'},
 {n:'verde',c:'#2ecc71',g:'g'},{n:'anaranjado',c:'#ff8a1f',g:'o'},{n:'morado',c:'#8e44ad',g:'p'},
 {n:'turquesa',c:'#1ec8c8',g:'b'},{n:'magenta',c:'#e6199b',g:'m'},{n:'lima',c:'#b4e22e',g:'g'},
 {n:'rosa',c:'#ff8fc7',g:'m'},{n:'celeste',c:'#74c8ff',g:'b'},{n:'violeta',c:'#6b5bff',g:'p'},{n:'marrón',c:'#8d5a3b',g:'n'}
];
const SHP=[
 '<path d="M50 6l13 29 31 3-23 21 7 31-28-17-28 17 7-31L6 38l31-3z"/>',
 '<path d="M50 90C14 62 6 40 20 24c11-11 25-7 30 5 5-12 19-16 30-5 14 16 6 38-30 66z"/>',
 '<ellipse cx="50" cy="42" rx="32" ry="38"/><path d="M50 80l-7 10h14z"/>',
 '<circle cx="50" cy="50" r="40"/>',
 '<path d="M50 6C50 6 18 46 18 64a32 32 0 0 0 64 0C82 46 50 6 50 6z"/>',
 '<path d="M50 6l40 44-40 44-40-44z"/>',
 '<circle cx="50" cy="22" r="19"/><circle cx="78" cy="42" r="19"/><circle cx="67" cy="75" r="19"/><circle cx="33" cy="75" r="19"/><circle cx="22" cy="42" r="19"/><circle cx="50" cy="52" r="14" fill="#fff"/>'
];
const svg=(s,c)=>`<svg viewBox="0 0 100 100" fill="${c}" aria-hidden="true">${s}<ellipse cx="36" cy="30" rx="9" ry="5" fill="#fff" opacity=".4" transform="rotate(-30 36 30)"/></svg>`;
const sw=(c,ch)=>`<span class="rep">${ch}</span><span>${c.n.toUpperCase()}</span><span class="dot" style="background:${c.c}"></span>`;
let target,lastM,lastI,busy,mode=1;
const ask=()=>mode===0?`¡Luna tiene hambre de algo ${target.n}!`:`¡Hola! Soy Isabella y busco algo de color ${target.n}.`;
function mixw(h,p){const n=parseInt(h.slice(1),16),f=x=>Math.round(x+(255-x)*p);return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`}
function setPal(c){
  const s=$('#colors').style,M=(k,v)=>s.setProperty(k,v);
  M('--sky1',mixw(c.c,.72));M('--sky2',mixw(c.c,.9));M('--glow',mixw(c.c,.82));M('--petal',c.c);M('--gr1','#a9dca8');M('--gr2','#7fc596');
}
function garden(){
  const g=$('#gdn');if(g.children.length)return;
  for(let i=0;i<14;i++){const b=document.createElement('b');b.className='fl';
    b.style.cssText=`left:${2+i*7}%;bottom:${2+Math.random()*24}%;font-size:${20+Math.random()*14}px;--d:${-Math.random()*4}s`;g.appendChild(b)}
  g.insertAdjacentHTML('beforeend','<span class="cloud" style="top:16%;animation-delay:-8s">☁️</span><span class="cloud" style="top:34%;animation-delay:-28s;font-size:64px">☁️</span>');
}
function cBtn(m){
  const b=$('#cBtn');b.textContent=m==='tut'?'¡A jugar! ▶':'🔊 Escuchar otra vez';
  b.onclick=m==='tut'?()=>skipFn&&skipFn():()=>target&&say(ask());
}
function colors(my){
  garden();mode=1;lastM=lastI=null;
  const mon=$('#mon');mon.textContent='🦄';mon.className='monster';
  setPal(COL[4]);$('#cBan').innerHTML=sw(COL[4],'🦄');$('#cField').innerHTML='';cBtn('tut');
  tutorial(my,[
    async()=>{await say('¡Hola princesa! Soy Luna la unicornio. ¡Vamos a conocer los colores!')},
    ...COL.map(c=>async()=>{
      $('#cBan').innerHTML=sw(c,'🦄');setPal(c);
      $('#cField').innerHTML=[0,1,2].map(i=>`<span class="ex3 pop">${c.e[i%c.e.length]}</span>`).join('');
      await say(`${c.n}. Como ${c.x}.`);await wait(500);
    })
  ],m=>round(m));
  $('#skip').hidden=true;
}
function round(my){
  busy=false;mode^=1;
  const f=$('#cField'),mon=$('#mon');f.innerHTML='';mon.className='monster';
  let items;
  if(mode===0){                       // 🦄 Luna: una fruta de cada color, hay que elegir la del color pedido
    mon.textContent='🦄';
    target=lastM=rnd(COL.filter(c=>c!==lastM));
    items=shuf(COL.map(c=>({c,h:rnd(c.e)})));
  }else{                              // 👧 Isabella: 6 objetos de colores distintos
    mon.textContent='👧';
    target=lastI=rnd(ISA.filter(c=>c!==lastI));
    const seen=new Set([target.g]),opts=[target];
    shuf(ISA).forEach(c=>{if(opts.length<6&&!seen.has(c.g)){seen.add(c.g);opts.push(c)}});
    const off=Math.floor(Math.random()*SHP.length);
    items=shuf(opts).map((c,i)=>({c,h:svg(SHP[(i+off)%SHP.length],c.c)}));
  }
  setPal(target);$('#cBan').innerHTML=sw(target,mode===0?'🦄':'👧');cBtn('play');
  items.forEach(it=>{
    const b=document.createElement('button');
    b.className='item pop';b.innerHTML=it.h;
    b.style.setProperty('--d',(Math.random()*-3)+'s');
    b.onclick=()=>pick(b,it,my);f.appendChild(b);
  });
  say(ask());
}
async function pick(b,it,my){
  if(busy||run!==my)return;
  const mon=$('#mon');
  if(it.c===target){
    busy=true;
    if(mode===0){                     // Luna se come la fruta
      const m=mon.getBoundingClientRect(),r=b.getBoundingClientRect();
      b.style.animation='none';b.style.transition='transform .7s ease-in';
      b.style.transform=`translate(${m.left+m.width/2-r.left-r.width/2}px,${m.top+m.height/2-r.top-r.height/2}px) scale(.2)`;
      await wait(700);if(run!==my)return;
      mon.classList.add('chew');tone(260,.12,'square',.08);tone(330,.12,'square',.08,.2);
      burst();say('¡Ñam, ñam! ¡Qué rico! ¡Muy bien, princesa!');
      await wait(1700);mon.classList.remove('chew');
    }else{                            // Isabella salta de alegría
      mon.classList.add('jump');polka();burst(36,['⭐','🌟','✨','⭐']);
      say(`¡Sí! ¡Es ${target.n}! ¡Gracias!`);
      await wait(2600);
    }
    if(run===my)round(my);
  }else{                              // rebote suave, sin castigo
    boop();b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
    setTimeout(()=>b.classList.remove('shake'),520);
    say(mode===0?`¡Oops! Ese no es ${target.n}. Busca algo ${target.n}.`:`Ese es ${it.c.n}. Busca ${target.n}.`);
  }
}
$('#mon').onclick=()=>target&&say(ask());

/* ---------- Módulo 2: Números ---------- */
const NUM=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez'];
const ANI=[['🐥','pío pío'],['🦆','cuac cuac'],['🐮','muuu'],['🐷','oinc oinc'],['🐑','beee'],['🦄','iiijiji'],['🐶','guau guau'],['🐱','miau'],['🐰','ñam ñam'],['🦋','fru fru']];
let cnt=0,party=false;
const NC=['#ff4d5e','#ff8a1f','#e8a800','#2fae5e','#3f93ff','#a855f7','#ff5fae','#14b8a6','#ef6c00','#6366f1'];
function setN(n){const b=$('#nBig');b.textContent=n;b.style.color=NC[n%10];b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}
function fill(n,e){[...$('#corral').children].forEach((s,i)=>{s.className='slot'+(i<n?' on':'');s.textContent=i<n?e:''})}
function farm(){const c=$('#corral');if(!c.children.length)for(let i=0;i<10;i++){const d=document.createElement('div');d.className='slot';c.appendChild(d)}}
function nBtn(m){const b=$('#carrot');b.textContent=m==='tut'?'¡A jugar! ▶':'🥕 ¡Toca para contar!';b.onclick=m==='tut'?()=>skipFn&&skipFn():tapCount}
function numbers(my){
  cnt=0;party=false;farm();fill(0);setN(0);nBtn('tut');
  tutorial(my,[
    async()=>{await say('¡Bienvenida a la granja! Vamos a contar animalitos.')},
    ...Array.from({length:10},(_,i)=>async()=>{
      const n=i+1,a=ANI[i];
      setN(n);
      fill(n,a[0]);
      tone(440+n*40,.2,'triangle',.12);
      await say(NUM[n]);await wait(400);
    })
  ],m=>{fill(0);setN(0);nBtn('play');cnt=0;party=false;say('¡Toca el botón para contar!')});$('#skip').hidden=true;
}
async function tapCount(){
  if(party)return;
  const my=run,c=++cnt,a=ANI[c-1];
  if(c===10)party=true;
  const sl=$('#corral').children[c-1];sl.textContent=a[0];sl.className='slot on an';
  setN(c);tone(300+c*50,.2,'triangle',.15);
  await say(`${NUM[c]}. ${a[1]}`);
  if(c===10&&run===my){
    polka();
    const t=setInterval(()=>burst(14),700);
    await wait(3000);clearInterval(t);
    if(run!==my)return;
    $('#corral').querySelectorAll('.on').forEach(e=>e.classList.add('bye'));
    await wait(900);if(run!==my)return;
    fill(0);setN(0);cnt=0;party=false;
  }
}

/* ---------- Módulo 3: Letras ---------- */
const LET={A:['✈️','Avión'],B:['⛵','Barco'],C:['🏠','Casa'],D:['🎲','Dado'],E:['🐘','Elefante'],F:['🌸','Flor'],G:['🐱','Gato'],H:['🍦','Helado'],I:['⛪','Iglesia'],J:['🦒','Jirafa'],K:['🐨','Koala'],L:['🦁','León'],M:['🦋','Mariposa'],N:['☁️','Nube'],Ñ:['🐦','Ñandú'],O:['🐻','Oso'],P:['🐟','Pez'],Q:['🧀','Queso'],R:['🐸','Rana'],S:['☀️','Sol'],T:['🚂','Tren'],U:['🍇','Uvas'],V:['🐄','Vaca'],W:['🧇','Wafle'],X:['🎹','Xilófono'],Y:['🪀','Yoyó'],Z:['👟','Zapato']};
const VOW=['A','E','I','O','U'];
let tgt=null,taps=0,lbusy=false;
function nameLetters(){
  return [...new Set($('#nm').value.toUpperCase().replace(/Ñ/g,'~').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/~/g,'Ñ').split('').filter(c=>LET[c]))];
}
function letters(my){
  $('#lField').innerHTML='';$('#lBan').textContent='🧚';
  tutorial(my,[
    async()=>{await say('¡Bienvenida al bosque encantado! Toca las letras mágicas.')},
    ...VOW.map(L=>async()=>{
      $('#lField').innerHTML=`<div class="ex pop" style="font-size:min(32vw,200px)">${L} ${LET[L][0]}</div>`;
      await say(`${L}... ${LET[L][1]}`);await wait(400);
    })
  ],m=>{taps=0;buildLetters(m)});
}
function buildLetters(my){
  const nl=nameLetters();
  const set=[...new Set([...VOW,...nl])];
  const rest=shuf(Object.keys(LET).filter(c=>!set.includes(c)));
  while(set.length<12)set.push(rest.pop());
  const f=$('#lField');f.innerHTML='';lbusy=false;
  shuf(set).forEach(L=>{
    const b=document.createElement('button');
    b.className='blk pop'+(nl.includes(L)?' name':'');b.textContent=L;
    b.style.setProperty('--d',(Math.random()*-3)+'s');
    b.onclick=()=>tapLetter(b,L,my);f.appendChild(b);
  });
  if(taps%4===0&&taps>0||taps===0&&nl.length&&Math.random()<.6){
    tgt=rnd(nl.length?nl:set);
    $('#lBan').textContent='¿Dónde está la '+tgt+'?';say('¿Dónde está la '+tgt+'?');
  }else{
    tgt=null;$('#lBan').textContent='👆 Toca una letra';say('¡Toca cualquier letra para ver qué pasa!');
  }
}
async function tapLetter(b,L,my){
  if(lbusy||run!==my)return;
  lbusy=true;taps++;
  const ok=tgt===L;
  b.classList.add('fly');b.textContent=LET[L][0];
  tone(600,.15,'triangle',.15);tone(900,.2,'triangle',.15,.15);
  if(ok)burst(18);
  await say(`${L}... ¡${LET[L][1]}!`);
  await wait(500);if(run!==my)return;
  b.classList.remove('fly');b.textContent=L;
  if(ok||taps%4===0||tgt===null&&taps%4===0)buildLetters(my);else lbusy=false;
}


/* ---------- Módulo 3: Vocales (puzzle) ---------- */
const VG={
 A:{p:[[0,18,22,82],[78,18,22,82],[0,0,100,18],[22,45,56,16]],an:[['🐝','Abeja','bzzz bzzz','zig'],['🕷️','Araña','tic tic tic','hop'],['🦅','Águila','kíiii kíiii','zig'],['🐿️','Ardilla','chi chi chi','hop']]},
 E:{p:[[0,0,22,100],[22,0,78,18],[22,41,60,18],[22,82,78,18]],an:[['🐘','Elefante','prrrrr','hop'],['🦔','Erizo','pic pic pic','hop'],['🪲','Escarabajo','trrr trrr','zig']]},
 I:{p:[[15,0,70,18],[39,18,22,64],[15,82,70,18]],an:[['🦎','Iguana','sssss','hop'],['🦌','Impala','pof pof','hop'],['🐦','Ibis','pío pío','zig']]},
 O:{p:[[0,0,100,18],[0,82,100,18],[0,18,22,64],[78,18,22,64]],an:[['🐻','Oso','grrr','hop'],['🐑','Oveja','beee beee','hop'],['🦧','Orangután','uh uh ah ah','hop'],['🐳','Orca','fuuush','hop']]},
 U:{p:[[0,0,22,82],[78,0,22,82],[0,82,100,18]],an:[['🦄','Unicornio','iiijiji','hop'],['🐦','Urraca','cra cra','zig'],['🦃','Urogallo','glu glu glu','hop']]}
};
const PC=['#ff6fb5','#a855f7','#3f93ff','#ffb800'];
let vow=null,left=0,vOver=false;
const lastAn={};
function pickAn(L){const n=VG[L].an.length;let k;do{k=Math.floor(Math.random()*n)}while(n>1&&k===lastAn[L]);return lastAn[L]=k}
function letters(my){vow=null;vNext(my)}
function vNext(my){
  const L=rnd(VOW.filter(v=>v!==vow));vow=L;const g=VG[L];left=g.p.length;vOver=false;
  $('#vAn').className='van';$('#vAn').textContent='';
  $('#vSign').innerHTML=`<span>¡Arma la</span><span class="vl">${L}</span><span>!</span>`;
  const bd=$('#vBoard');bd.className='board';
  bd.innerHTML=g.p.map((r,i)=>`<i class="sl" id="sl${i}" style="left:${r[0]}%;top:${r[1]}%;width:${r[2]}%;height:${r[3]}%;--c:${PC[i]}"></i>`).join('');
  $('#vTray').innerHTML=shuf(g.p.map((r,i)=>i)).map(i=>{const r=g.p[i];
    return `<button class="pcb pop" data-i="${i}" aria-label="Pieza"><i class="mini" style="--c:${PC[i]};--w:${r[2]};--h:${r[3]}"></i></button>`}).join('');
  say(`¡Arma la ${L}!`);
}
$('#vTray').onclick=e=>{const b=e.target.closest('.pcb');if(b&&!b.disabled)place(b)};
function place(b){
  const my=run,i=+b.dataset.i,sl=$('#sl'+i),m=b.firstElementChild;
  b.disabled=true;
  const a=m.getBoundingClientRect(),t=sl.getBoundingClientRect(),c=m.cloneNode();
  Object.assign(c.style,{position:'fixed',left:a.left+'px',top:a.top+'px',width:a.width+'px',height:a.height+'px',zIndex:40,transition:'all .45s cubic-bezier(.3,1.4,.5,1)'});
  document.body.appendChild(c);m.style.visibility='hidden';
  requestAnimationFrame(()=>requestAnimationFrame(()=>Object.assign(c.style,{left:t.left+'px',top:t.top+'px',width:t.width+'px',height:t.height+'px'})));
  setTimeout(()=>{
    c.remove();if(run!==my)return;
    sl.classList.add('on');tone(520+left*60,.12,'sine',.2);tone(780,.1,'triangle',.12,.06);
    if(--left===0)vDone(my);
  },480);
}
async function vDone(my){
  const L=vow,g=VG[L],an=g.an[pickAn(L)];
  $('#vBoard').classList.add('glow');win();
  await say(`¡${L}!`);if(run!==my)return;
  const A=$('#vAn');A.textContent=an[0];A.className='van '+an[3];
  burst(24);await say(`¡${an[1]}! ${an[2]}`);
  await wait(1500);if(run!==my)return;
  vNext(my);
}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{voice=null};
</script>
